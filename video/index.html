<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Perfectly Nineties"; src: url("assets/fonts/PerfectlyNineties.otf") format("opentype"); font-display: block; }
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      :root {
        --ground: #ffffff;
        --stone: #f6f5f2;
        --ink: #0a0a0a;
        --accent: #d9622b;
        --neg: #a32d1d;
        --pos: #1f7a4d;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; background: var(--ground); font-family: "Geist", sans-serif; color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <!-- Scenes. Later scenes sit above earlier ones and bring their own ground in. -->
      <div id="s1-hook" class="clip" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="6.6" data-track-index="1" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s2-tension" class="clip" data-composition-id="s2-tension" data-composition-src="compositions/s2-tension.html" data-start="6" data-duration="8.8" data-track-index="2" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="s3-reveal" class="clip" data-composition-id="s3-reveal" data-composition-src="compositions/s3-reveal.html" data-start="14" data-duration="5.1" data-track-index="1" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="s4-predict" class="clip" data-composition-id="s4-predict" data-composition-src="compositions/s4-predict.html" data-start="18.5" data-duration="9.1" data-track-index="2" data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="s5-plan" class="clip" data-composition-id="s5-plan" data-composition-src="compositions/s5-plan.html" data-start="27" data-duration="8" data-track-index="1" data-width="1920" data-height="1080" style="z-index: 5"></div>
      <div id="s6-live" class="clip" data-composition-id="s6-live" data-composition-src="compositions/s6-live.html" data-start="35" data-duration="9.6" data-track-index="2" data-width="1920" data-height="1080" style="z-index: 6"></div>
      <div id="s7-payoff" class="clip" data-composition-id="s7-payoff" data-composition-src="compositions/s7-payoff.html" data-start="44" data-duration="8" data-track-index="1" data-width="1920" data-height="1080" style="z-index: 7"></div>
      <div id="s8-end" class="clip" data-composition-id="s8-end" data-composition-src="compositions/s8-end.html" data-start="52" data-duration="8" data-track-index="2" data-width="1920" data-height="1080" style="z-index: 8"></div>

      <!-- Sound effects only (no music bed). -->
      <audio id="sfx-flood" src="assets/sfx/whoosh.mp3" data-start="6" data-duration="0.57" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-cut1" src="assets/sfx/swish.mp3" data-start="10" data-duration="0.44" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-cut2" src="assets/sfx/swish.mp3" data-start="10.9" data-duration="0.44" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-cut3" src="assets/sfx/swish.mp3" data-start="11.8" data-duration="0.44" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-reveal" src="assets/sfx/whoosh.mp3" data-start="14" data-duration="0.57" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-predict" src="assets/sfx/whoosh.mp3" data-start="18.5" data-duration="0.57" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-plan" src="assets/sfx/whoosh.mp3" data-start="27" data-duration="0.57" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-alarm" src="assets/sfx/chime.mp3" data-start="37.2" data-duration="2.45" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-payoff" src="assets/sfx/whoosh.mp3" data-start="44" data-duration="0.57" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-mark" src="assets/sfx/impact.mp3" data-start="55.2" data-duration="4" data-track-index="13" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
