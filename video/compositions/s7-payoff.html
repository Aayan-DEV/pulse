<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Perfectly Nineties"; src: url("assets/fonts/PerfectlyNineties.otf") format("opentype"); font-display: block; }
        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        .s7-bg { position: absolute; inset: 0; background: #f6f5f2; }
        .s7-cap { position: absolute; left: 120px; top: 88px; font-family: "Perfectly Nineties", serif; font-weight: 400; font-size: 104px; line-height: 1; letter-spacing: -0.01em; color: #0a0a0a; white-space: nowrap; }
        .s7-cap .w { display: inline-block; }
        .s7-cap .s7-hot { color: #d9622b; }
        .s7-cam { position: absolute; left: 80px; top: 300px; width: 1760px; height: 471px; transform-origin: 0 0; }
        .s7-card { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 18px 40px rgba(20, 19, 16, 0.1); }
        .s7-card img { display: block; width: 100%; height: 100%; }
        .s7-ring { position: absolute; left: 757px; top: 374px; width: 124px; height: 41px; border: 2px solid #1f7a4d; border-radius: 8px; }
      </style>

      <div id="root" data-composition-id="s7-payoff" data-width="1920" data-height="1080">
        <div id="s7-bg" class="s7-bg"></div>
        <h2 id="s7-cap1" class="s7-cap"><span class="w">Every</span> <span class="w s7-hot">spike</span> <span class="w">explained</span></h2>
        <h2 id="s7-cap2" class="s7-cap"><span class="w">Crew</span> <span class="w s7-hot">notes</span> <span class="w">count</span> <span class="w">too</span></h2>
        <div id="s7-cam" class="s7-cam" data-layout-allow-overflow>
          <div class="s7-card"><img src="assets/shots/shift-card.png" alt="" /></div>
          <div id="s7-ring" class="s7-ring"></div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s7-bg", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power2.inOut" }, 0);
          tl.fromTo("#s7-cap1 .w", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.08 }, 0.5);
          tl.fromTo("#s7-cam", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.7);
          // Punch into the researched answer and its confirmed badge.
          tl.to("#s7-cam", { x: -670, y: -280, scale: 1.8, duration: 1.0, ease: "power2.inOut" }, 2.2);
          tl.fromTo("#s7-ring", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power4.out" }, 3.3);
          // Pan across to what the crew wrote.
          tl.to("#s7-cap1", { opacity: 0, y: -30, duration: 0.3, ease: "power3.in" }, 4.8);
          tl.to("#s7-cam", { x: -1703, y: -107, duration: 1.0, ease: "power2.inOut" }, 4.9);
          tl.fromTo("#s7-cap2 .w", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.08 }, 5.3);
          window.__timelines["s7-payoff"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
