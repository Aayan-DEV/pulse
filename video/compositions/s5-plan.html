<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Perfectly Nineties"; src: url("assets/fonts/PerfectlyNineties.otf") format("opentype"); font-display: block; }
        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        .s5-bg { position: absolute; inset: 0; background: #ffffff; }
        .s5-cap { position: absolute; left: 120px; top: 88px; font-family: "Perfectly Nineties", serif; font-weight: 400; font-size: 104px; line-height: 1; letter-spacing: -0.01em; color: #0a0a0a; white-space: nowrap; }
        .s5-cap .w { display: inline-block; }
        .s5-cap .s5-hot { color: #d9622b; }
        .s5-hero { position: absolute; left: 120px; top: 246px; width: 1680px; height: 117px; border-radius: 8px; overflow: hidden; box-shadow: 0 18px 40px rgba(20, 19, 16, 0.08); }
        .s5-hero img { display: block; width: 100%; height: 100%; }
        .s5-win { position: absolute; left: 120px; top: 396px; width: 1680px; height: 640px; border-radius: 8px; overflow: hidden; box-shadow: 0 18px 40px rgba(20, 19, 16, 0.1); background: #fff; }
        .s5-who { position: absolute; left: 0; top: 0; width: 1680px; height: 869px; }
        .s5-who img { display: block; width: 100%; height: 100%; }
      </style>

      <div id="root" data-composition-id="s5-plan" data-width="1920" data-height="1080">
        <div id="s5-bg" class="s5-bg"></div>
        <h2 id="s5-cap" class="s5-cap"><span class="w">Shifts</span> <span class="w">that</span> <span class="w s5-hot">fit</span> <span class="w">the</span> <span class="w">forecast</span></h2>
        <div id="s5-hero" class="s5-hero"><img src="assets/shots/staffing-hero.png" alt="" /></div>
        <div id="s5-win" class="s5-win">
          <div id="s5-who" class="s5-who" data-layout-allow-overflow><img src="assets/shots/staffing-who.png" alt="" /></div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // Wipe in from the right edge, like the next page sliding over.
          tl.fromTo("#s5-bg", { clipPath: "inset(0px 0px 0px 100%)" }, { clipPath: "inset(0px 0px 0px 0%)", duration: 0.6, ease: "power2.inOut" }, 0);
          tl.fromTo("#s5-cap .w", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.08 }, 0.5);
          tl.fromTo("#s5-hero", { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.9);
          tl.fromTo("#s5-win", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 1.3);
          // Slow pan down the rota: every hour covered.
          tl.fromTo("#s5-who", { y: 0 }, { y: -229, duration: 4.2, ease: "power2.inOut" }, 2.6);
          window.__timelines["s5-plan"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
