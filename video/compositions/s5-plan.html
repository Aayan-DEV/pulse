<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Perfectly Nineties"; src: url("assets/fonts/PerfectlyNineties.otf") format("opentype"); font-display: block; }
        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        .s5-wipe { position: absolute; inset: 0; }
        .s5-ground { position: absolute; inset: 0; background: #ffffff; }
        .s5-cam { position: absolute; left: 0; top: 0; width: 1600px; height: 1598px; transform-origin: 0 0; border-radius: 8px; overflow: hidden; box-shadow: 0 18px 40px rgba(20, 19, 16, 0.12); background: #fff; }
        .s5-layer { position: absolute; inset: 0; }
        #s5-sharp { clip-path: inset(-40px -40px -40px -40px round 10px); }
        #s5-base { filter: blur(0px); }
        .s5-layer img { display: block; width: 1600px; height: 1598px; }
        .s5-veil { position: absolute; inset: 0; background: #f6f5f2; opacity: 0; }
        .s5-ring { position: absolute; border: 3px solid #1f7a4d; border-radius: 10px; opacity: 0; }
        .s5-cap { position: absolute; left: 64px; bottom: 64px; padding: 18px 34px 22px; border-radius: 8px; background: #fff; box-shadow: 0 18px 40px rgba(20, 19, 16, 0.16); font-family: "Perfectly Nineties", serif; font-weight: 400; font-size: 76px; line-height: 1; letter-spacing: -0.01em; color: #0a0a0a; white-space: nowrap; }
        .s5-cap .w { display: inline-block; }
        .s5-cap .s5-hot { color: #d9622b; }
      </style>

      <div id="root" data-composition-id="s5-plan" data-width="1920" data-height="1080">
        <div id="s5-wipe" class="s5-wipe">
          <div class="s5-ground"></div>
          <div id="s5-cam" class="s5-cam" data-layout-allow-overflow>
            <div id="s5-base" class="s5-layer"><img src="assets/shots/staffing.png" alt="" /></div>
            <div id="s5-veil" class="s5-veil"></div>
            <div id="s5-sharp" class="s5-layer"><img src="assets/shots/staffing.png" alt="" /></div>
            <div id="s5-ring" class="s5-ring"></div>
          </div>
        </div>
        <div id="s5-cap" class="s5-cap"><span class="w">Shifts</span> <span class="w">that</span> <span class="w s5-hot">fit</span> <span class="w">the</span> <span class="w">forecast</span></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const W = 1600, H = 1598;
          const camEl = "#s5-cam", base = "#s5-base", veil = "#s5-veil", sharp = "#s5-sharp", ring = "#s5-ring";
          const cam = (cx, cy, s) => ({ x: 960 - cx * s, y: 500 - cy * s, scale: s });
          const clip = (b, q = 8) => `inset(${b[1] - q}px ${W - b[0] - b[2] - q}px ${H - b[1] - b[3] - q}px ${b[0] - q}px round 10px)`;
          const FULL = "inset(-40px -40px -40px -40px round 10px)";
          const focus = (t, b, d = 0.6) => {
            tl.to(sharp, { clipPath: clip(b), duration: d, ease: "power2.inOut" }, t);
            tl.to(base, { filter: "blur(7px)", duration: d, ease: "power2.out" }, t);
            tl.to(veil, { opacity: 0.5, duration: d, ease: "power2.out" }, t);
          };
          const clear = (t, d = 0.6) => {
            tl.to(sharp, { clipPath: FULL, duration: d, ease: "power2.inOut" }, t);
            tl.to(base, { filter: "blur(0px)", duration: d, ease: "power2.out" }, t);
            tl.to(veil, { opacity: 0, duration: d, ease: "power2.out" }, t);
          };
          const ringAt = (t, b, q = 8) => {
            tl.set(ring, { left: b[0] - q, top: b[1] - q, width: b[2] + 2 * q, height: b[3] + 2 * q }, t);
            tl.fromTo(ring, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power4.out", immediateRender: false }, t);
          };

          // Panel boxes on the Staffing page (CSS px).
          const HERO = [260, 170, 1316, 92];
          const TOP = [260, 170, 1316, 208];
          const CHART = [260, 438, 1316, 347];
          const WHO = [260, 801, 1316, 681];

          tl.set(camEl, { x: 96, y: 0, scale: 1.08 }, 0);

          // The Staffing dashboard wipes in from the right.
          tl.fromTo("#s5-wipe", { clipPath: "inset(0px 0px 0px 100%)" }, { clipPath: "inset(0px 0px 0px 0%)", duration: 0.6, ease: "power2.inOut" }, 0);
          tl.fromTo("#s5-cap", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power4.out" }, 0.5);
          tl.fromTo("#s5-cap .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, stagger: 0.05, ease: "expo.out" }, 0.53);
          // Everyone covered, and legal.
          focus(1.2, TOP);
          tl.to(camEl, { ...cam(918, 274, 1.3), duration: 0.8, ease: "power2.inOut" }, 1.2);
          ringAt(1.7, HERO);
          // Crew needed vs planned, hour by hour.
          tl.to(ring, { opacity: 0, duration: 0.15 }, 2.8);
          focus(2.8, CHART);
          tl.to(camEl, { ...cam(918, 611, 1.3), duration: 0.8, ease: "power2.inOut" }, 2.8);
          // Who works: scroll down the rota.
          focus(4.3, WHO);
          tl.to(camEl, { ...cam(918, 1000, 1.15), duration: 0.9, ease: "power2.inOut" }, 4.3);
          tl.to(camEl, { ...cam(918, 1060, 1.22), duration: 1.6, ease: "sine.inOut" }, 5.2);
          // Pull back to the whole page.
          clear(6.8);
          tl.to(camEl, { x: 419, y: 0, scale: 0.676, duration: 0.9, ease: "power2.inOut" }, 6.8);
          tl.to("#s5-cap", { opacity: 0, y: -12, duration: 0.25, ease: "power3.in" }, 7.6);
          window.__timelines["s5-plan"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
