<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Perfectly Nineties"; src: url("assets/fonts/PerfectlyNineties.otf") format("opentype"); font-display: block; }
        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        .s6-ground { position: absolute; inset: 0; background: #f6f5f2; }
        .s6-win { position: absolute; left: 173px; top: 36px; width: 1574px; height: 885px; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 18px 40px rgba(20, 19, 16, 0.14); }
        .s6-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
        .s6-cam video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
        .s6-live { position: absolute; left: 173px; top: 966px; display: flex; align-items: center; gap: 14px; font-family: "Geist", sans-serif; font-weight: 500; font-size: 30px; color: #a32d1d; }
        .s6-live i { width: 16px; height: 16px; border-radius: 50%; background: #a32d1d; display: block; }
        .s6-cap { position: absolute; left: 0; right: 0; top: 948px; text-align: center; font-family: "Perfectly Nineties", serif; font-weight: 400; font-size: 68px; line-height: 1; letter-spacing: -0.01em; color: #0a0a0a; white-space: nowrap; }
        .s6-cap .w { display: inline-block; }
        .s6-cap .s6-hot { color: #d9622b; }
      </style>
      <div id="root" data-composition-id="s6-live" data-width="1920" data-height="1080">
        <div class="s6-ground"></div>
        <div id="s6-win" class="s6-win">
          <div id="s6-cam" class="s6-cam" data-layout-allow-overflow>
            <video id="s6-vid" class="clip" src="assets/live/shift.mp4" data-start="0" data-duration="16.6" muted playsinline></video>
          </div>
        </div>
        <div id="s6-live" class="s6-live"><i id="s6-dot"></i>Live demo</div>
        <div id="s6-cap1" class="s6-cap"><span class="w">The</span> <span class="w">shift</span> <span class="w">screen,</span> <span class="w s6-hot">right</span> <span class="w s6-hot">now</span></div>
        <div id="s6-cap2" class="s6-cap"><span class="w">We</span> <span class="w">simulate</span> <span class="w">a</span> <span class="w s6-hot">rush</span></div>
        <div id="s6-cap3" class="s6-cap"><span class="w">Pulse</span> <span class="w">says:</span> <span class="w s6-hot">call</span> <span class="w s6-hot">help</span> <span class="w">now</span></div>
        <div id="s6-cap4" class="s6-cap"><span class="w">Each</span> <span class="w s6-hot">spike</span> <span class="w">gets</span> <span class="w">a</span> <span class="w">card</span></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const K = 1574 / 1920;
          const cam = (cx, cy, s) => { const k = K * s; let x = 787 - cx * k, y = 442.5 - cy * k; x = Math.min(0, Math.max(1574 - 1920 * k, x)); y = Math.min(0, Math.max(885 - 1080 * k, y)); return { x: x, y: y, scale: k }; };
          const caption = (sel, t, out) => {
            tl.fromTo(sel, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power4.out" }, t);
            tl.fromTo(sel + " .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, stagger: 0.05, ease: "expo.out" }, t + 0.03);
            if (out != null) tl.to(sel, { opacity: 0, y: -10, duration: 0.25, ease: "power3.in" }, out);
          };
          tl.set("#s6-cam", cam(960, 540, 1), 0);
          tl.fromTo("#s6-win", { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo("#s6-live", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
          tl.fromTo("#s6-dot", { opacity: 1 }, { opacity: 0.25, duration: 0.6, ease: "sine.inOut", repeat: 27, yoyo: true }, 0.3);
          caption("#s6-cap1", 0.3, 3.0);
          // Push in on this hour and the rush button.
          tl.to("#s6-cam", { ...cam(760, 700, 1.45), duration: 1.0, ease: "power2.inOut" }, 0.9);
          caption("#s6-cap2", 3.15, 5.5);
          // The alarm lands: rush now, crew needed.
          tl.to("#s6-cam", { ...cam(1100, 560, 1.2), duration: 0.8, ease: "power2.inOut" }, 4.8);
          caption("#s6-cap3", 5.65, 11.4);
          // This hour turns red.
          tl.to("#s6-cam", { ...cam(540, 820, 1.6), duration: 0.8, ease: "power2.inOut" }, 8.1);
          tl.to("#s6-cam", { ...cam(960, 540, 1), duration: 0.7, ease: "power2.inOut" }, 11.0);
          caption("#s6-cap4", 12.4, null);
          tl.to("#s6-cam", { ...cam(1100, 520, 1.15), duration: 0.9, ease: "power2.inOut" }, 13.6);
          window.__timelines["s6-live"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
