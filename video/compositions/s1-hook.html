<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Perfectly Nineties"; src: url("assets/fonts/PerfectlyNineties.otf") format("opentype"); font-display: block; }
        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        .s1-bg { position: absolute; inset: 0; background: #f6f5f2; }
        .s1-cam { position: absolute; left: 310px; top: 300px; width: 1300px; height: 710px; transform-origin: 0 0; }
        .s1-panel { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; box-shadow: 0 18px 40px rgba(20, 19, 16, 0.1); background: #fff; }
        .s1-panel img { display: block; width: 1300px; height: 710px; }
        .s1-mark { position: absolute; left: 18px; top: 156px; width: 1264px; height: 104px; border: 4px solid #a32d1d; border-radius: 8px; }
        .s1-title { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-family: "Perfectly Nineties", serif; font-weight: 400; font-size: 128px; line-height: 1; letter-spacing: -0.01em; color: #0a0a0a; }
        .s1-title .w { display: inline-block; }
        .s1-title .s1-hot { color: #a32d1d; }
      </style>

      <div id="root" data-composition-id="s1-hook" data-width="1920" data-height="1080">
        <div class="s1-bg"></div>
        <div id="s1-cam" class="s1-cam" data-layout-allow-overflow>
          <div class="s1-panel"><img src="assets/shots/transit-shutdowns.png" alt="" /></div>
          <div id="s1-mark" class="s1-mark"></div>
        </div>
        <h1 id="s1-title" class="s1-title"><span class="w">The</span> <span class="w s1-hot">worst</span> <span class="w">day</span> <span class="w">for</span> <span class="w">trains</span></h1>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const cam = document.querySelector("#s1-cam");
          const words = document.querySelectorAll("#s1-title .w");
          // Open close on row 1 (already readable at frame 0), then pull back to the whole panel.
          tl.fromTo(cam, { x: -110, y: -153, scale: 1.9 }, { x: -110, y: -153, scale: 1.9, duration: 1.6 }, 0);
          tl.to(cam, { x: 32.5, y: -10, scale: 0.95, duration: 1.3, ease: "power2.inOut" }, 1.6);
          tl.fromTo("#s1-mark", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.5);
          tl.fromTo(words, { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", stagger: 0.08 }, 2.4);
          // Exit: everything except the red row steps back as the red takes over.
          tl.to(["#s1-title", ".s1-panel"], { opacity: 0.0, duration: 0.3, ease: "power3.in" }, 5.7);
          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
