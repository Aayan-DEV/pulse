<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Perfectly Nineties"; src: url("assets/fonts/PerfectlyNineties.otf") format("opentype"); font-display: block; }
        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        .s3-bg { position: absolute; inset: 0; background: #ffffff; }
        .s3-stack { position: absolute; left: 0; right: 0; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 56px; }
        .s3-mark { width: 220px; height: 220px; color: #d9622b; }
        .s3-mark svg { width: 220px; height: 220px; display: block; }
        .s3-title { font-family: "Perfectly Nineties", serif; font-weight: 400; font-size: 136px; line-height: 1; letter-spacing: -0.01em; color: #0a0a0a; text-align: center; }
        .s3-title .w { display: inline-block; }
        .s3-title .s3-hot { color: #d9622b; }
      </style>

      <div id="root" data-composition-id="s3-reveal" data-width="1920" data-height="1080">
        <div id="s3-bg" class="s3-bg"></div>
        <div id="s3-stack" class="s3-stack">
          <div class="s3-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path pathLength="1" d="M19.07 4.93A10 10 0 0 0 6.99 3.34" />
              <path pathLength="1" d="M4 6h.01" />
              <path pathLength="1" d="M2.29 9.62A10 10 0 1 0 21.31 8.35" />
              <path pathLength="1" d="M16.24 7.76A6 6 0 1 0 8.23 16.67" />
              <path pathLength="1" d="M12 18h.01" />
              <path pathLength="1" d="M17.99 11.66A6 6 0 0 1 15.77 16.67" />
              <circle pathLength="1" cx="12" cy="12" r="2" />
              <path pathLength="1" d="m13.41 10.59 5.66-5.66" />
            </svg>
          </div>
          <h2 id="s3-title" class="s3-title"><span class="w s3-hot">Pulse</span> <span class="w">sees</span> <span class="w">it</span> <span class="w">coming</span></h2>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // A white circle opens from the centre and wipes the red away.
          tl.fromTo("#s3-bg", { clipPath: "circle(0% at 50% 40%)" }, { clipPath: "circle(120% at 50% 40%)", duration: 0.7, ease: "expo.inOut" }, 0);
          tl.fromTo("#s3-stack .s3-mark path, #s3-stack .s3-mark circle", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDasharray: 1, strokeDashoffset: 0, duration: 0.7, ease: "power2.out", stagger: 0.05 }, 0.35);
          tl.fromTo(".s3-mark", { scale: 0.7, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.8, ease: "expo.out" }, 0.35);
          tl.fromTo("#s3-title .w", { opacity: 0, y: 30, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "expo.out", stagger: 0.07 }, 0.7);
          // Push: the page scrolls up into the product.
          tl.to("#s3-stack", { y: -260, opacity: 0, duration: 0.5, ease: "power2.inOut" }, 2.9);
          window.__timelines["s3-reveal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
